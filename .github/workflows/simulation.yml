name: BORU live paper simulation
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/start-paper-session']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: boru-live-paper
  cancel-in-progress: false
jobs:
  requested:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.gate.outputs.start }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('start', 'true');
              return;
            }
            const before = context.payload.before;
            const after = context.payload.after || context.payload.pull_request.head.sha;
            if (!before || !after) {
              core.setOutput('start', 'false');
              return;
            }
            const result = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${before}...${after}`
            });
            const changed = (result.data.files || []).some(f => f.filename === '.github/start-paper-session' && f.status !== 'removed');
            core.setOutput('start', String(changed));
  verify:
    needs: requested
    if: needs.requested.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install matplotlib==3.10.8
      - name: Test accounting and execution safeguards
        run: python -m unittest -v
      - name: Verify live public data without creating a trading account
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from boru import MarketData,utc
          feed=MarketData()
          tickers=feed.tickers()
          book=feed.book('btc_tl')
          Path('data').mkdir(exist_ok=True)
          report={'mode':'DATA_PREFLIGHT_ONLY','timestamp_utc':utc(),'tl_markets':len(tickers),'valid_btc_book':bool(book['bids'])}
          Path('data/preflight.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report),flush=True)
          PYCODE
      - name: Verify candle and chain sources
        run: python probe_feeds.py
      - uses: actions/upload-artifact@v4
        with:
          name: boru-initial-state
          path: data/
          retention-days: 7
  simulate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boru-initial-state
          path: data
      - run: python -m pip install matplotlib==3.10.8
      - run: npm install --prefix .github/actions/trade-reports --ignore-scripts --no-audit --no-fund
      - name: Run live paper session with per-trade charts
        uses: ./.github/actions/trade-reports
        with:
          mode: simulate
          pr-number: '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save simulation ledger and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boru-session-results
          path: data/
          retention-days: 30
