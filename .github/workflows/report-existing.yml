name: BORU existing-session chart reports
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/report-existing.yml']
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: boru-report-original-43849993630
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 205
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install matplotlib==3.10.8
      - run: npm install --prefix .github/actions/trade-reports --ignore-scripts --no-audit --no-fund
      - name: Validate report calculations and layout generation
        run: python -m unittest -v
      - name: Collect the existing run and publish graphic reports
        uses: ./.github/actions/trade-reports
        with:
          mode: collect
          source-run: '43849993630'
          pr-number: '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save report files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boru-report-recovery
          path: data/trade_reports/
          retention-days: 30
