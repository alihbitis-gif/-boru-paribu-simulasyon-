name: Paribu data check
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public feeds and official documentation
        shell: python
        run: |
          import urllib.request, json
          urls = [
            "https://docs.paribu.com/api/llms.txt",
            "https://docs.paribu.com/api/market-data/ticker.md",
            "https://docs.paribu.com/api/market-data/orderbook.md",
            "https://api.paribu.com/market/ticker",
            "https://api.paribu.com/orderbook?market=btc_tl&depth=5",
            "https://www.paribu.com/ticker",
          ]
          for url in urls:
            print("\nURL:", url, flush=True)
            try:
              req = urllib.request.Request(url, headers={"User-Agent": "BoruPaperResearch/0.1", "Accept": "application/json,text/plain,*/*"})
              with urllib.request.urlopen(req, timeout=20) as r:
                body = r.read(2000000).decode("utf-8", "replace")
                print("STATUS:", r.status, "CONTENT-TYPE:", r.headers.get("Content-Type"))
                try:
                  data=json.loads(body)
                  print("JSON SAMPLE:", repr(list(data.items())[:3] if isinstance(data,dict) else data[:3])[:12000])
                except Exception:
                  print(body[:16000])
            except Exception as e:
              print(type(e).__name__, str(e)[:300])
