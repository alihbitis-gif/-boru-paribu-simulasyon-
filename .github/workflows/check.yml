name: Paper simulation checks
on:
  pull_request:
    paths: ['*.py', '.github/actions/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install matplotlib==3.10.8
      - run: python -m unittest -v
